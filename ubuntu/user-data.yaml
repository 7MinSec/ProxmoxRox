#cloud-config
# Required Variables:
# -----------------
# VM_HOSTNAME: The hostname for the VM (e.g., "pentest-vm")
# TIMEZONE: The timezone for the VM (e.g., "America/Chicago")
# USERNAME: The username to create (e.g., "pentester")
# USER_PASSWORD: The password for the user
# TAILSCALE_AUTH_KEY: Your Tailscale authentication key
# SMTP_URL: SMTP server URL (e.g., "smtps://smtp.gmail.com:465")
# SMTP_FROM: Sender email address
# SMTP_TO: Recipient email address
# SMTP_USER: SMTP username
# SMTP_PASSWORD: SMTP password
#
# Usage:
# ------
# 1. Replace all ${VARIABLE_NAME} placeholders with your actual values
# 2. Remove the # from the Tailscale command line if you want to use Tailscale
# 3. Update the email configuration with your SMTP server details
# 4. Save the file as user-data.yaml
# 5. Use this file with your cloud-init or Proxmox configuration

hostname: ${VM_HOSTNAME}
manage_etc_hosts: true
timezone: ${TIMEZONE}

# User configuration
users:
  - name: ${USERNAME}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/${USERNAME}
    shell: /bin/bash
    lock_passwd: false

# System configuration
ssh_pwauth: true
disable_root: false
package_update: true
package_upgrade: true
packages:
  - docker.io
  - git
  - libpcap-dev
  - lightdm
  - make
  - net-tools
  - nfs-common
  - nmap
  - pipx
  - plocate
  - python3
  - python3-pip
  - python3-venv
  - qemu-guest-agent
  - tshark
  - ubuntu-desktop
  - vim

write_files:
  - path: /var/log/vm-build.log
    permissions: '0644'
    content: |
      VM Build Progress Log
      --------------------
      Started at: $(date)
      
  - path: /etc/motd
    content: |
      Welcome to ${VM_HOSTNAME}!
      
      Build Status: In Progress
      Check /var/log/vm-build.log for build progress
      
  - path: /usr/local/bin/log_progress
    permissions: '0755'
    content: |
      #!/bin/bash
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a /var/log/vm-build.log
      wall "$1"

  - path: /home/${USERNAME}/tail.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      curl -fsSL https://tailscale.com/install.sh | sh
      #sudo tailscale up --authkey=${TAILSCALE_AUTH_KEY}

  - path: /etc/systemd/system/cloud-init-progress.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Display Cloud-Init Progress
      After=network.target

      [Service]
      Type=simple
      ExecStart=/bin/bash -c 'clear; echo "Cloud-Init Setup in Progress..."; tail -f /var/log/vm-build.log'
      StandardOutput=tty
      TTYPath=/dev/tty1
      TTYReset=yes
      TTYVHangup=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  - /usr/local/bin/log_progress "Setting up user password..."
  - echo '${USERNAME}:${USER_PASSWORD}' | chpasswd
  - systemctl enable cloud-init-progress.service
  - systemctl start cloud-init-progress.service
  - /usr/local/bin/log_progress "Starting VM build process"
  - /usr/local/bin/log_progress "Setting up home directory permissions..."
  - chown -R ${USERNAME}:${USERNAME} /home/${USERNAME}
  - chmod 755 /home/${USERNAME}
  - /usr/local/bin/log_progress "Home directory permissions set"
  - /usr/local/bin/log_progress "Copying xfer directory..."
  - mkdir -p /home/${USERNAME}/xfer
  - cp -r /var/lib/vz/snippets/xfer/* /home/${USERNAME}/xfer/
  - chown -R ${USERNAME}:${USERNAME} /home/${USERNAME}/xfer
  - chmod -R 755 /home/${USERNAME}/xfer
  - /usr/local/bin/log_progress "Xfer directory copied"
  - /usr/local/bin/log_progress "Installing QEMU guest agent..."
  - apt-get install -y qemu-guest-agent
  - systemctl start qemu-guest-agent
  - /usr/local/bin/log_progress "QEMU guest agent installed and started"
  - /usr/local/bin/log_progress "Setting up user environment"

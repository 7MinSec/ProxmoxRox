  - su - ${USERNAME} -c 'git clone https://github.com/ZerBea/wifi_laboratory.git /home/${USERNAME}/wifi_laboratory' && /usr/local/bin/log_progress "Cloned wifi_laboratory"
  - su - ${USERNAME} -c 'mkdir -p /home/${USERNAME}/nessus' && /usr/local/bin/log_progress "Created nessus directory"
  - su - ${USERNAME} -c 'curl --request GET --url "https://www.tenable.com/downloads/api/v2/pages/nessus/files/Nessus-10.8.2-ubuntu1604_amd64.deb" --output "/home/${USERNAME}/nessus/Nessus-10.8.2-ubuntu1604_amd64.deb"' && /usr/local/bin/log_progress "Downloaded Nessus"
  - /usr/local/bin/log_progress "Installing pipx packages"
  - su - ${USERNAME} -c 'pipx install exegol' && /usr/local/bin/log_progress "Installed exegol"
  - su - ${USERNAME} -c 'pipx ensurepath' && /usr/local/bin/log_progress "Configured pipx path"
  - su - ${USERNAME} -c 'source ~/.bashrc'
  - su - ${USERNAME} -c 'echo "alias exegol='\''sudo -E $(which exegol)'\''" >> /home/${USERNAME}/.bash_aliases'
  - su - ${USERNAME} -c 'source ~/.bashrc'

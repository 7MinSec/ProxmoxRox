  - /usr/local/bin/log_progress "Installing Tailscale..."
  - chown ${USERNAME}:${USERNAME} /home/${USERNAME}/tail.sh
  - su - ${USERNAME} -c '/home/${USERNAME}/tail.sh' && /usr/local/bin/log_progress "Tailscale installed and configured"
  - |
    VM_NAME=$(hostname | tr '[:lower:]' '[:upper:]')
    VM_ID=$(cat /etc/pve/.vmid)
    VM_IP=$(hostname -I | awk '{print $1}')
    PROXMOX_HOSTNAME=$(hostname -s | tr '[:lower:]' '[:upper:]')
    
    # Update MOTD to show completion
    echo "Welcome to ${VM_NAME}!

    Build Status: Complete
    VM ID: ${VM_ID}
    IP Address: ${VM_IP}
    
    Build log available at: /var/log/vm-build.log" > /etc/motd
    
    # Only send email if flag file doesn't exist
    if [ ! -f /var/lib/cloud/instance/email-sent ]; then
        email_content="Subject: $PROXMOX_HOSTNAME - $VM_NAME - VMID: $VM_ID - VM Build Complete

        Your VM build is now complete.
        VM Name: $VM_NAME
        VM ID: $VM_ID
        IP Address: $VM_IP

        You can now:
        1. Log in with username '${USERNAME}' and password '${USER_PASSWORD}'
        2. Check /var/log/vm-build.log for build details
        3. Access the VM via SSH: ssh ${USERNAME}@$VM_IP"
        
        echo "$email_content" | curl --url '${SMTP_URL}' --ssl-reqd \
          --mail-from '${SMTP_FROM}' \
          --mail-rcpt '${SMTP_TO}' \
          --user '${SMTP_USER}:${SMTP_PASSWORD}' \
          --upload-file -
        
        # Create flag file to indicate email was sent
        touch /var/lib/cloud/instance/email-sent
    fi
  - /usr/local/bin/log_progress "Email alert sent"
  - /usr/local/bin/log_progress "Build complete, rebooting system"
  - reboot 
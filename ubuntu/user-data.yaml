  - su - ${USERNAME} -c 'git clone https://github.com/jtesta/ssh-audit.git /home/${USERNAME}/ssh-audit' && /usr/local/bin/log_progress "Cloned ssh-audit"
  - su - ${USERNAME} -c 'git clone https://github.com/drwetter/testssl.sh.git /home/${USERNAME}/testssl.sh' && /usr/local/bin/log_progress "Cloned testssl.sh"
  - su - ${USERNAME} -c 'git clone https://github.com/zer1t0/ticket_converter.git /home/${USERNAME}/ticket_converter' && /usr/local/bin/log_progress "Cloned ticket_converter"

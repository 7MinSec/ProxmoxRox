  - su - ${USERNAME} -c 'docker pull bettercap/bettercap' && /usr/local/bin/log_progress "Pulled bettercap image"
  - su - ${USERNAME} -c 'docker pull oscarakaelvis/evil-winrm' && /usr/local/bin/log_progress "Pulled evil-winrm image"
  - su - ${USERNAME} -c 'docker pull ghcr.io/sensepost/gowitness:latest' && /usr/local/bin/log_progress "Pulled gowitness image"
